<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Sense - Posts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="common-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">
                <div class="brand-icon">
                    <i class="fas fa-city"></i>
                </div>
                <span class="brand-text">Civic Sense</span>
            </a>
            
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                <a href="report.html" class="nav-link"><i class="fas fa-exclamation-circle"></i> Report</a>
                <a href="posts.html" class="nav-link active"><i class="fas fa-images"></i> Posts</a>
                <a href="reels.html" class="nav-link"><i class="fas fa-video"></i> Media</a>
                <a href="news.html" class="nav-link"><i class="fas fa-newspaper"></i> News</a>
            </div>
            
            <div class="nav-actions">
                <button class="theme-toggle" id="theme-toggle" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            
            <button class="mobile-menu-btn" id="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav hidden" id="mobile-nav">
        <a href="dashboard.html" class="mobile-nav-link"><i class="fas fa-home"></i> Home</a>
        <a href="report.html" class="mobile-nav-link"><i class="fas fa-exclamation-circle"></i> Report Issue</a>
        <a href="posts.html" class="mobile-nav-link active"><i class="fas fa-images"></i> Posts</a>
        <a href="reels.html" class="mobile-nav-link"><i class="fas fa-video"></i> Media</a>
        <a href="news.html" class="mobile-nav-link"><i class="fas fa-newspaper"></i> News</a>
    </nav>

    <!-- Page Wrapper -->
    <div class="page-wrapper">
        <div class="page-container">
            <!-- Page Header -->
            <div class="page-header">
                <span class="page-badge"><i class="fas fa-images"></i> Community Posts</span>
                <h1 class="page-title">Share Your Stories</h1>
                <p class="page-subtitle">Create and share posts with the community to inspire civic engagement</p>
            </div>

            <!-- Create Post Card -->
            <div class="glass-card" style="max-width: 700px; margin: 0 auto 30px;">
                <div class="card-header">
                    <div class="card-header-icon">
                        <i class="fas fa-plus"></i>
                    </div>
                    <h2>Create New Post</h2>
                </div>
                <div class="card-body">
                    <form id="postUploadForm" enctype="multipart/form-data">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-heading"></i> Post Title
                                </label>
                                <input type="text" id="postTitle" name="title" class="form-input" placeholder="Enter a catchy title..." required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">
                                    <i class="fas fa-user"></i> Author Name
                                </label>
                                <input type="text" id="postAuthor" name="author" class="form-input" placeholder="Your name..." required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-folder"></i> Category
                            </label>
                            <select id="postCategory" name="category" class="form-select" required>
                                <option value="">Select a category...</option>
                                <option value="civic">Civic Issues</option>
                                <option value="environment">Environment</option>
                                <option value="community">Community</option>
                                <option value="infrastructure">Infrastructure</option>
                                <option value="safety">Public Safety</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-align-left"></i> Content
                            </label>
                            <textarea id="postExcerpt" name="excerpt" class="form-textarea" placeholder="Share your story or thoughts..." required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <i class="fas fa-image"></i> Upload Image
                            </label>
                            <div class="file-upload-zone" id="imageUploadZone">
                                <div class="file-upload-icon">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                </div>
                                <p class="file-upload-text">Drag & drop your image here</p>
                                <p class="file-upload-hint">or <span>browse</span> to upload</p>
                                <input type="file" id="postImage" name="image" accept="image/*" style="display: none;" required>
                            </div>
                            <div id="imagePreview" class="file-preview" style="display: none;">
                                <div class="file-preview-item">
                                    <img id="previewImg" src="" alt="Preview">
                                    <button type="button" class="file-preview-remove" onclick="removeImage()">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary btn-lg btn-block">
                                <i class="fas fa-paper-plane"></i> Publish Post
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Posts Feed -->
            <div class="glass-card" style="max-width: 700px; margin: 0 auto;">
                <div class="card-header">
                    <div class="card-header-icon">
                        <i class="fas fa-fire"></i>
                    </div>
                    <h2>Recent Posts</h2>
                </div>
                <div class="card-body" id="postsContainer" style="padding: 0;">
                    <!-- Posts will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // State
        let postsData = [];
        let selectedImage = null;

        // DOM Elements
        const postsContainer = document.getElementById('postsContainer');
        const postForm = document.getElementById('postUploadForm');
        const imageUploadZone = document.getElementById('imageUploadZone');
        const postImageInput = document.getElementById('postImage');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const themeToggle = document.getElementById('theme-toggle');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileNav = document.getElementById('mobile-nav');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadPosts();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Theme Toggle
            themeToggle.addEventListener('click', toggleDarkMode);
            
            // Mobile Menu
            mobileMenuBtn.addEventListener('click', () => {
                mobileNav.classList.toggle('hidden');
            });
            
            // Image Upload Zone
            imageUploadZone.addEventListener('click', () => postImageInput.click());
            
            imageUploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                imageUploadZone.classList.add('dragover');
            });
            
            imageUploadZone.addEventListener('dragleave', () => {
                imageUploadZone.classList.remove('dragover');
            });
            
            imageUploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                imageUploadZone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleImageSelect(file);
                }
            });
            
            postImageInput.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    handleImageSelect(e.target.files[0]);
                }
            });
            
            // Form Submit
            postForm.addEventListener('submit', handleFormSubmit);
        }

        function handleImageSelect(file) {
            selectedImage = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                imagePreview.style.display = 'flex';
                imageUploadZone.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            selectedImage = null;
            postImageInput.value = '';
            imagePreview.style.display = 'none';
            imageUploadZone.style.display = 'block';
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const title = document.getElementById('postTitle').value;
            const author = document.getElementById('postAuthor').value;
            const category = document.getElementById('postCategory').value;
            const excerpt = document.getElementById('postExcerpt').value;
            
            if (!selectedImage) {
                showToast('Please select an image', 'error');
                return;
            }
            
            const formData = new FormData();
            formData.append('title', title);
            formData.append('author', author);
            formData.append('excerpt', excerpt);
            formData.append('category', category);
            formData.append('date', new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }));
            formData.append('image', selectedImage);
            
            try {
                const response = await fetch('/posts', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showToast(data.error, 'error');
                    return;
                }
                
                // Add new post to the beginning
                postsData.unshift({
                    title: data.post.title,
                    author: data.post.author,
                    excerpt: data.post.excerpt,
                    date: data.post.date,
                    imageUrl: data.post.imageUrl,
                    category: category,
                    likes: 0,
                    comments: 0
                });
                
                renderPosts();
                
                // Reset form
                postForm.reset();
                removeImage();
                
                showToast('Post published successfully!', 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to publish post', 'error');
            }
        }

        async function loadPosts() {
            // Show loading skeleton
            postsContainer.innerHTML = Array(3).fill(`
                <div style="padding: 20px; border-bottom: 1px solid var(--border-color);">
                    <div class="skeleton" style="height: 200px; margin-bottom: 15px;"></div>
                    <div class="skeleton" style="height: 24px; width: 70%; margin-bottom: 10px;"></div>
                    <div class="skeleton" style="height: 16px; width: 50%;"></div>
                </div>
            `).join('');
            
            try {
                const response = await fetch('/posts');
                postsData = await response.json();
                renderPosts();
            } catch (error) {
                console.error('Error loading posts:', error);
                postsContainer.innerHTML = '<p style="text-align: center; padding: 40px; color: var(--text-secondary);">Failed to load posts</p>';
            }
        }

        function renderPosts() {
            if (postsData.length === 0) {
                postsContainer.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <i class="fas fa-images" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 16px;"></i>
                        <p style="color: var(--text-secondary);">No posts yet. Be the first to share!</p>
                    </div>
                `;
                return;
            }
            
            postsContainer.innerHTML = postsData.map(post => `
                <div class="post-card" style="padding: 24px; border-bottom: 1px solid var(--border-color);">
                    ${post.imageUrl ? `
                        <div style="margin: -24px -24px 20px; overflow: hidden;">
                            <img src="${post.imageUrl}" alt="${post.title}" 
                                 style="width: 100%; height: 250px; object-fit: cover;"
                                 onerror="this.style.display='none'">
                        </div>
                    ` : ''}
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                        <div style="width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary-500), var(--teal-500)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
                            ${post.author.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div style="font-weight: 600; color: var(--text-primary);">${post.author}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${post.date}</div>
                        </div>
                        ${post.category ? `
                            <span class="status-badge" style="margin-left: auto; background: var(--primary-50); color: var(--primary-600);">
                                ${post.category}
                            </span>
                        ` : ''}
                    </div>
                    <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">${post.title}</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 16px; line-height: 1.6;">${post.excerpt}</p>
                    <div style="display: flex; gap: 20px; padding-top: 16px; border-top: 1px solid var(--border-color);">
                        <button class="engage-btn like-btn" onclick="toggleLike(this)" style="display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--bg-secondary); border: none; border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; transition: all 0.2s;">
                            <i class="far fa-heart"></i> <span>${post.likes || 0}</span>
                        </button>
                        <button style="display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--bg-secondary); border: none; border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer;">
                            <i class="far fa-comment"></i> <span>${post.comments || 0}</span>
                        </button>
                        <button onclick="sharePost('${post.title}')" style="display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--bg-secondary); border: none; border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; margin-left: auto;">
                            <i class="fas fa-share-alt"></i> Share
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleLike(btn) {
            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('span');
            let count = parseInt(countSpan.textContent);
            
            if (icon.classList.contains('far')) {
                icon.classList.remove('far');
                icon.classList.add('fas');
                btn.style.color = 'var(--danger-500)';
                countSpan.textContent = count + 1;
            } else {
                icon.classList.remove('fas');
                icon.classList.add('far');
                btn.style.color = '';
                countSpan.textContent = count - 1;
            }
        }

        function sharePost(title) {
            if (navigator.share) {
                navigator.share({ title: title });
            } else {
                navigator.clipboard.writeText(title);
                showToast('Link copied to clipboard!', 'success');
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
            themeToggle.querySelector('i').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
            localStorage.setItem('darkMode', !isDark);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Load saved theme
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.querySelector('i').className = 'fas fa-sun';
        }
    </script>
</body>
</html>
